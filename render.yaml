services:
  - type: web
    name: firewatch-ai-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
